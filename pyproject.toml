[project]
name = "text2sql-lora"
version = "0.1.0"
description = "LoRA fine-tune of Qwen2.5-1.5B-Instruct for text-to-SQL, scored by execution match on Spider"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "huggingface-hub",
    "matplotlib",
    "requests",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
